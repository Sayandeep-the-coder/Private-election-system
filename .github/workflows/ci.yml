name: CI/CD Pipeline

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  # ─────────────────────────────────────────────
  # Job 1: Run Smart Contract Tests
  # ─────────────────────────────────────────────
  contract-tests:
    name: 🧪 Contract Tests (6 pure circuit tests)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run contract test suite
        run: npm run test --workspace=contract

  # ─────────────────────────────────────────────
  # Job 2: Build the Next.js DApp
  # ─────────────────────────────────────────────
  dapp-build:
    name: 🏗️ Build DApp (Next.js 16)
    runs-on: ubuntu-latest
    needs: contract-tests

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build Next.js application
        run: npm run build --workspace=dapp
        env:
          NEXT_PUBLIC_DEPLOYED_CONTRACT_ADDRESS: ${{ vars.NEXT_PUBLIC_DEPLOYED_CONTRACT_ADDRESS || '' }}

  # ─────────────────────────────────────────────
  # Job 3: Lint the DApp
  # ─────────────────────────────────────────────
  dapp-lint:
    name: 🔍 Lint DApp (ESLint)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint --workspace=dapp
